<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="650" viewBox="0 0 1530 650" role="img" aria-labelledby="title desc">
<title id="title">Data-Model-Hardware Closed Loop</title>
<desc id="desc">Simulation RSI and human data jointly train UniWAM, integrated with a Discrete Forcing action expert. Deployment through ActiveScale active perception hardware extends toward whole-body manipulation. Real-world feedback supports iterative refinement. Cross-paper connections represent the proposed integrated research framework.</desc>
